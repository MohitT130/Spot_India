<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F2A">
<title>Track a report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Telugu:wght@700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="vf-bl" aria-hidden="true"></span>
    <span class="vf-br" aria-hidden="true"></span>
    <span class="wordmark">Spot India</span>
    <p class="tagline">Report what you see.</p>
  </div>
  <nav class="bar-links">
    <a href="/">Report</a>
    <a href="/feed">Feed</a>
  </nav>
</header>

<main>
  <h1>Track a report</h1>
  <p class="lede">Enter the code from your report, for example SPOT-251102-K7QX9F.</p>

  <div class="row">
    <input id="tid" type="text" placeholder="SPOT-..." autocapitalize="characters" autocomplete="off">
    <button id="go" class="primary">Find</button>
  </div>

  <div id="out"></div>

  <section id="mine" hidden>
    <h2 style="margin:28px 0 10px">Reports from this device</h2>
    <ul class="list" id="mine-list"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function fmt(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? String(ts) : d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
}

async function look(tid) {
  const out = $('out');
  out.innerHTML = '<p class="empty">Looking…</p>';
  try {
    const r = await fetch(`/api/report/${encodeURIComponent(tid)}`);
    const d = await r.json();
    if (!d.ok) {
      out.innerHTML = d.stored === false
        ? '<p class="err">No report database is configured yet, so reports cannot be looked up. The report was still delivered.</p>'
        : '<p class="err">No report found with that code. Check the spelling.</p>';
      return;
    }
    const x = d.report;
    // Only Submitted is real today. Later steps are drawn as planned so the
    // page never implies progress that has not happened.
    const STEPS = ['submitted', 'acknowledged', 'in_progress', 'resolved'];
    const LABELS = { submitted: 'Submitted', acknowledged: 'Acknowledged',
                     in_progress: 'In progress', resolved: 'Resolved' };
    const at = STEPS.indexOf(x.status);
    const stepper = `<ul class="stepper">${STEPS.map((st, i) => {
      const cls = i < at ? 'done' : i === at ? 'now' : 'planned';
      return `<li class="${cls}"><div class="s-box">${LABELS[st]}</div>`
           + (cls === 'planned' ? '<span class="s-tag">planned</span>' : '')
           + `</li>`;
    }).join('')}</ul>`;
    out.innerHTML = `
      <div class="card">
        <div class="card-top">
          <span class="card-tid">${x.tracking_id}</span>
          <span class="card-tid">${fmt(x.created_at)}</span>
        </div>
        <h2>${x.category_name}</h2>
        <div class="card-chips">
          <span class="sev sev-${x.severity}">${x.severity}</span>
          <span class="tag status-${x.status}">${String(x.status).replace('_', ' ')}</span>
        </div>
        <p class="card-meta">Routed to ${x.authority_name}</p>
        <p class="card-meta">${x.address_short || ''}</p>
        <p class="card-meta">Filed ${fmt(x.created_at)}</p>
        ${x.photo_url ? `<img class="thumb" style="margin-top:12px" src="${x.photo_url}" alt="Reported scene">
           <p class="card-meta">This photo is not shown on the public feed until face and number plate blurring is built.</p>` : ''}
        ${x.note ? `<p class="card-meta">Note: ${x.note}</p>` : ''}
        ${stepper}
        ${x.lat ? `<p class="card-meta"><a href="https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lng}" target="_blank" rel="noopener">Open location in Maps</a></p>` : ''}
      </div>`;
  } catch {
    out.innerHTML = '<p class="err">Could not reach the server.</p>';
  }
}

$('go').onclick = () => { const v = $('tid').value.trim().toUpperCase(); if (v) look(v); };
$('tid').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

// Deep link: /track/SPOT-...
const seg = location.pathname.split('/').filter(Boolean);
if (seg.length > 1) { $('tid').value = decodeURIComponent(seg[1]).toUpperCase(); look($('tid').value); }

// Local history, a convenience that works with no database at all.
try {
  const mine = JSON.parse(localStorage.getItem('spot_reports') || '[]');
  if (mine.length) {
    $('mine').hidden = false;
    $('mine-list').innerHTML = mine.map((m) => `
      <li class="card"><div class="card-top">
        <a class="card-tid" href="/track/${m.tid}">${m.tid}</a>
        <span class="card-tid">${fmt(m.at)}</span>
      </div><h2>${m.cat}</h2></li>`).join('');
  }
} catch { /* private mode */ }
</script>
</body>
</html>
